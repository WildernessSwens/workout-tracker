<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Forty-Seven & Forward</title>
<style>
  :root {
    --cream: #FBF6EE;
    --card: #FFFFFF;
    --line: #E4D9C8;
    --line-light: #EFE6D8;
    --line-faint: #F4EEE3;
    --ink: #3A2F26;
    --muted: #6B5B4D;
    --faint: #A89580;
    --accent: #B5651D;
    --skin: #D4A574;
    --skin-d: #B8865A;
    --body: #6B5B4D;
    --equip: #3A2F26;
    --bench: #C4A882;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--cream); color:var(--ink); padding:24px 16px 48px; padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(48px,env(safe-area-inset-bottom)); }
  .wrap { max-width:640px; margin:0 auto; }
  header { margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .eyebrow { font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; font-weight:600; }
  h1 { font-size:28px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em; }
  .subtitle { font-family:'Helvetica Neue',Arial,sans-serif; font-size:14px; color:var(--muted); margin:0; }

  .day-card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .day-header { width:100%; display:flex; justify-content:space-between; align-items:center; background:transparent; border:none; padding:16px 18px; cursor:pointer; text-align:left; font-size:17px; font-weight:700; color:var(--ink); font-family:Georgia,serif; }
  .day-header .chev { font-family:'Helvetica Neue',Arial,sans-serif; color:var(--muted); font-size:14px; }
  .exercise-list { padding:0 14px 14px; display:none; flex-direction:column; gap:12px; }
  .exercise-list.open { display:flex; }

  .ex-card { background:var(--cream); border:1px solid var(--line-light); border-radius:10px; overflow:hidden; }
  .ex-header { padding:10px 12px 6px; }
  .ex-name { font-weight:700; font-size:15px; }
  .ex-target { font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--faint); margin-top:2px; }
  .last-log { font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--accent); font-weight:600; margin-top:3px; }

  .ex-frames { display:flex; gap:0; border-top:1px solid var(--line-light); border-bottom:1px solid var(--line-light); background:#F0E8D8; }
  .ex-frame { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 4px 4px; }
  .ex-frame:first-child { border-right:1px solid var(--line-light); }
  .ex-frame svg { width:100%; max-width:160px; height:110px; display:block; }
  .frame-label { font-family:'Helvetica Neue',Arial,sans-serif; font-size:10px; color:var(--accent); font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }

  .ex-body { padding:8px 12px 10px; }
  .input-row { display:flex; gap:6px; align-items:stretch; }
  .input-row input { font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; padding:8px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .in-small { width:80px; flex-shrink:0; }
  .in-wide { flex:1; min-width:0; }
  .log-btn { flex-shrink:0; width:38px; border:none; border-radius:7px; background:var(--accent); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--cream); font-size:16px; }
  .log-btn:active { opacity:.8; }

  .card-footer { margin-top:8px; }
  .link-btn { font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--muted); background:transparent; border:none; padding:0; cursor:pointer; }

  .history-panel { margin-top:10px; padding-top:10px; border-top:1px solid var(--line-light); display:none; }
  .history-panel.open { display:block; }
  .empty-note { font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--faint); padding:10px 0; text-align:center; }
  .history-list { margin-top:8px; display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto; }
  .history-row { display:flex; align-items:center; gap:8px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; padding:4px 0; border-bottom:1px solid var(--line-faint); }
  .h-date { color:var(--faint); width:70px; flex-shrink:0; }
  .h-details { flex:1; color:var(--ink); }
  .h-notes { color:var(--faint); font-style:italic; }
  .del-btn { background:transparent; border:none; cursor:pointer; padding:2px; color:var(--faint); font-size:14px; line-height:1; }

  .chart-wrap { width:100%; height:140px; margin-bottom:4px; }
  svg.chart text { font-family:'Helvetica Neue',Arial,sans-serif; font-size:10px; fill:var(--muted); }
  svg.chart .gridline { stroke:var(--line-light); stroke-width:1; }
  svg.chart .trend { fill:none; stroke:var(--accent); stroke-width:2; }
  svg.chart .dot { fill:var(--accent); }

  .toolbar { display:flex; gap:8px; margin-bottom:20px; }
  .tool-btn { flex:1; font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; font-weight:600; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; }
  .tool-btn:active { background:var(--line-faint); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:100; white-space:nowrap; }
  .toast.show { opacity:1; }
  footer { margin-top:32px; text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Strength, sustained</div>
    <h1>Forty-Seven &amp; Forward</h1>
    <p class="subtitle">A rolling 5-day program. Log it, watch the trend.</p>
  </header>
  <div class="toolbar">
    <button class="tool-btn" id="exportBtn">Export backup</button>
    <button class="tool-btn" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
  <div id="days"></div>
  <footer>Data saved in this browser on this device.</footer>
</div>
<div class="toast" id="toast"></div>

// ── Program ───────────────────────────────────────────────────────────────────
const PROGRAM = {
  "Day 1 — Chest & Triceps": [
    { name: "Dumbbell Bench Press", target: "3×8-10" },
    { name: "Incline Dumbbell Flyes", target: "2×10-12" },
    { name: "Tricep Overhead Extension", target: "3×10-12" },
    { name: "Bench Dips", target: "2×10-15" }
  ],
  "Day 2 — Back & Biceps": [
    { name: "Dumbbell/Barbell Rows", target: "3×8-10" },
    { name: "Dumbbell Pullover", target: "2×10-12" },
    { name: "Bicep Curls", target: "3×10-12" },
    { name: "Hammer Curls", target: "2×10-12" }
  ],
  "Day 3 — Legs": [
    { name: "Goblet Squats", target: "3×10-12" },
    { name: "Romanian Deadlift", target: "2×10" },
    { name: "Bulgarian Split Squats", target: "2×8-10/leg" },
    { name: "Standing Calf Raises", target: "3×15" }
  ],
  "Day 4 — Shoulders & Core": [
    { name: "Seated Shoulder Press", target: "3×8-10" },
    { name: "Lateral Raises", target: "3×12-15" },
    { name: "Front Raises", target: "2×10-12" },
    { name: "Dead Bugs", target: "3×10/side" },
    { name: "Bird Dogs", target: "2×10/side" }
  ],
  "Day 5 — Full Body / Functional": [
    { name: "Dumbbell Deadlift", target: "3×8" },
    { name: "Push Press", target: "3×8" },
    { name: "Renegade Rows", target: "2×8/side" },
    { name: "Plank", target: "3×30-45s" }
  ]
};

// ── Storage ───────────────────────────────────────────────────────────────────
const KEY = "workout-logs-v1";
function loadLogs() { try { const r=localStorage.getItem(KEY); return r?JSON.parse(r):{};} catch(e){return{};}}
function saveLogs(l) { try{localStorage.setItem(KEY,JSON.stringify(l));return true;}catch(e){showToast("Couldn't save");return false;}}
let logs = loadLogs();
function todayStr(){return new Date().toISOString().slice(0,10);}
function xid(n){return n.replace(/[^a-zA-Z0-9]/g,"_");}
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  const el=document.getElementById("days"); el.innerHTML="";
  Object.entries(PROGRAM).forEach(([day,exercises],di)=>{
    const dc=document.createElement("div"); dc.className="day-card";
    const h=document.createElement("button"); h.className="day-header";
    h.innerHTML=`<span>${day}</span><span class="chev">${di===0?"▾":"▸"}</span>`;
    const list=document.createElement("div"); list.className="exercise-list"+(di===0?" open":"");
    h.addEventListener("click",()=>{const o=list.classList.toggle("open");h.querySelector(".chev").textContent=o?"▾":"▸";});
    exercises.forEach(e=>list.appendChild(buildCard(e)));
    dc.appendChild(h); dc.appendChild(list); el.appendChild(dc);
  });
}

function buildCard({name,target}){
  const id=xid(name); const history=logs[name]||[]; const last=history[history.length-1];
  const lastText=last?`Last: ${last.weight?last.weight+"lb ":""}${last.reps?"× "+last.reps:""}`.trim():"";
  const frames=SVGS[name]||{start:"",end:""};
  const card=document.createElement("div"); card.className="ex-card";
  card.innerHTML=`
    <div class="ex-header">
      <div class="ex-name">${esc(name)}</div>
      <div class="ex-target">${esc(target)}</div>
      ${last?`<div class="last-log">${esc(lastText)}</div>`:""}
    </div>
    <div class="ex-frames">
      <div class="ex-frame">${frames.start}<div class="frame-label">Start</div></div>
      <div class="ex-frame">${frames.end}<div class="frame-label">End</div></div>
    </div>
    <div class="ex-body">
      <div class="input-row">
        <input class="in-small" type="number" inputmode="decimal" placeholder="Weight (lb)" id="w_${id}">
        <input class="in-small" type="text" inputmode="numeric" placeholder="Reps" id="r_${id}">
        <input class="in-wide" type="text" placeholder="Notes" id="n_${id}">
        <button class="log-btn" id="log_${id}" aria-label="Log">✓</button>
      </div>
      <div class="card-footer">
        <button class="link-btn" id="hist_${id}">History (${history.length})</button>
      </div>
      <div class="history-panel" id="panel_${id}"></div>
    </div>`;

  card.querySelector(`#log_${id}`).addEventListener("click",()=>{
    const w=card.querySelector(`#w_${id}`).value.trim();
    const r=card.querySelector(`#r_${id}`).value.trim();
    const n=card.querySelector(`#n_${id}`).value.trim();
    if(!w&&!r&&!n)return;
    logs[name]=logs[name]||[];
    logs[name].push({date:todayStr(),weight:w,reps:r,notes:n});
    if(saveLogs(logs)){showToast("Logged ✓");render();}
  });
  const hb=card.querySelector(`#hist_${id}`); const panel=card.querySelector(`#panel_${id}`);
  hb.addEventListener("click",()=>{const o=panel.classList.toggle("open");hb.textContent=o?"Hide history":`History (${(logs[name]||[]).length})`;if(o)renderHistory(panel,name);});
  return card;
}

function renderHistory(panel,name){
  const history=logs[name]||[]; panel.innerHTML="";
  const weighted=history.filter(e=>e.weight!==""&&!isNaN(parseFloat(e.weight)));
  if(weighted.length>=2)panel.appendChild(buildChart(weighted));
  else{const n=document.createElement("div");n.className="empty-note";n.textContent="Log weight twice to see a trend.";panel.appendChild(n);}
  if(!history.length){const n=document.createElement("div");n.className="empty-note";n.textContent="No entries yet.";panel.appendChild(n);return;}
  const list=document.createElement("div");list.className="history-list";
  history.slice().reverse().forEach((e,i)=>{
    const ri=history.length-1-i; const row=document.createElement("div"); row.className="history-row";
    const det=`${e.weight?e.weight+"lb ":""}${e.reps?"× "+e.reps:""}`.trim();
    row.innerHTML=`<span class="h-date">${esc(e.date)}</span><span class="h-details">${esc(det)}${e.notes?` <span class="h-notes">— ${esc(e.notes)}</span>`:""}</span><button class="del-btn">✕</button>`;
    row.querySelector(".del-btn").addEventListener("click",()=>{logs[name].splice(ri,1);saveLogs(logs);render();});
    list.appendChild(row);
  });
  panel.appendChild(list);
}

function buildChart(entries){
  const W=300,H=140,P={t:10,r:10,b:24,l:32};
  const vals=entries.map(e=>parseFloat(e.weight));
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const yMin=mn-rng*.15,yMax=mx+rng*.15,iW=W-P.l-P.r,iH=H-P.t-P.b;
  const pts=entries.map((e,i)=>({x:P.l+i*(entries.length>1?iW/(entries.length-1):0),y:P.t+iH-((parseFloat(e.weight)-yMin)/(yMax-yMin))*iH,label:e.date.slice(5)}));
  const path=pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  let grid="",dots="",labels="";
  for(let i=0;i<=2;i++){const y=P.t+(iH/2)*i;grid+=`<line class="gridline" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/>`;}
  const skip=Math.max(1,Math.ceil(pts.length/5));
  pts.forEach((p,i)=>{dots+=`<circle class="dot" cx="${p.x}" cy="${p.y}" r="3"/>`;if(i%skip===0||i===pts.length-1)labels+=`<text x="${p.x}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`;});
  const wrap=document.createElement("div");wrap.className="chart-wrap";
  wrap.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${grid}<path class="trend" d="${path}"/>${dots}${labels}</svg>`;
  return wrap;
}

// ── Export / Import ───────────────────────────────────────────────────────────
document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(logs,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`workout-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast("Backup downloaded");
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))throw new Error("bad format");logs=parsed;saveLogs(logs);render();showToast("Backup restored");}catch(err){showToast("Couldn't read file");}};
  reader.readAsText(file);e.target.value="";
});

render();
</script>
